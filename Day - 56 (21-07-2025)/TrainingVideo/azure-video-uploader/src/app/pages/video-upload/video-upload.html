<div class="video-upload-container">
  <h2>Upload Training Video</h2>

  <form (ngSubmit)="onUpload()" enctype="multipart/form-data">
    <div class="form-group">
      <label for="file">Select Video File:</label>
      <input type="file" id="file" (change)="onFileSelected($event)" accept="video/*" required />
    </div>

    <div class="form-group">
      <label for="title">Title:</label>
      <input type="text" id="title" [(ngModel)]="title" name="title" required />
    </div>

    <div class="form-group">
      <label for="description">Description:</label>
      <textarea id="description" [(ngModel)]="description" name="description" rows="3" required></textarea>
    </div>

    <button type="submit" [disabled]="!selectedFile || !title || !description">Upload</button>
  </form>

  <div class="message" *ngIf="uploadMessage">
    {{ uploadMessage }}
  </div>
</div>
